# Technical Construction Equipment Tracking and Monitoring System
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: equipment_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cv-service:
    build:
      context: .
      dockerfile: services/cv_service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./videos:/app/videos
      - ./config:/app/config
      - ./frames:/app/frames
    environment:
      PYTHONUNBUFFERED: "1"

  analytics-backend:
    build:
      context: .
      dockerfile: services/analytics_backend/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./frames:/app/frames
      - ./videos:/app/videos
    environment:
      PYTHONUNBUFFERED: "1"

  dashboard:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    depends_on:
      - analytics-backend
    ports:
      - "8501:8501"
    volumes:
      - ./config:/app/config
    environment:
      PYTHONUNBUFFERED: "1"

volumes:
  postgres-data:
