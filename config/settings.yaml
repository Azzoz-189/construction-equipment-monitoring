# Technical Construction Equipment Tracking and Monitoring System - Configuration

video:
  frame_skip: 3              # Process every Nth frame for CPU performance
  resize_width: 640          # Resize frame width for inference
  input_dir: "/app/videos"   # Video files directory

detection:
  model: "yolov8n.pt"              # Default COCO model
  # model: "models/construction_yolov8n.pt"  # Uncomment after fine-tuning
  custom_model: false               # Set to true when using fine-tuned model
  confidence_threshold: 0.4
  device: "cpu"
  input_size: 640
  # COCO class IDs to detect (truck=7, car=2, bus=5) - used when custom_model: false
  target_classes: [2, 5, 7]
  # Friendly names mapping
  class_names:
    2: "car"
    5: "bus"
    7: "truck"

tracking:
  track_thresh: 0.25
  track_buffer: 90
  match_thresh: 0.8
  equipment_id_prefix:
    # COCO classes (backward compatible)
    truck: "DT"
    car: "VH"
    bus: "BU"
    # Construction equipment classes
    excavator: "EX"
    dump_truck: "DT"
    wheel_loader: "WL"
    crane: "CR"
    bulldozer: "BD"
    default: "EQ"

reid:
  enabled: true
  similarity_threshold: 0.65
  max_lost_buffer: 50
  histogram_bins: [8, 8, 8]
  feature_ttl_seconds: 300

motion:
  magnitude_threshold: 2.0    # Minimum optical flow magnitude to consider as "moving"
  upper_region_ratio: 0.5     # Top portion of bbox for arm/boom region
  flow_method: "farneback"    # Optical flow method

activity:
  smoothing_window: 5         # N-frame smoothing to prevent flickering
  vertical_flow_threshold: 1.5
  horizontal_flow_threshold: 1.5

kafka:
  bootstrap_servers: "kafka:9092"
  topic: "equipment-events"
  client_id: "cv-service-producer"
  consumer_group: "analytics-consumer"

database:
  host: "postgres"
  port: 5432
  name: "equipment_analytics"
  user: "postgres"
  password: "postgres"
  uri: "postgresql://postgres:postgres@postgres:5432/equipment_analytics"

dashboard:
  api_url: "http://analytics-backend:8000"
  refresh_interval: 1         # seconds
  page_title: "Technical Construction Equipment Tracking & Monitoring System"
